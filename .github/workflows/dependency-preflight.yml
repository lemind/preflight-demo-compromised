name: Dependency preflight
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write # the re-check comment on pull requests
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Reads package.json and package-lock.json only; nothing is installed, built or run.
      - uses: lemind/dependency-preflight@2b25fabb525192e98ee71285f43c785258b09e8f
        with:
          case-label: "Controlled test case: historical incident (December 2024 @solana/web3.js compromise). Not a real project."
